[package]
name = "face"
version = "0.1.0"
description = "Sol: Marco's one surface"
authors = ["Marco"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "face_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }   # sign out and clear wait on WebKit without holding a worker (thing.rs)

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSResponder", "NSGraphics", "NSEvent", "NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSView", "NSTrackingArea", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray", "NSString", "NSSet", "NSDate", "NSProcessInfo"] }
# the things' browser store: sign out and clear (thing.rs)
objc2-web-kit = { version = "0.3", features = ["block2", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebsiteDataRecord"] }
block2 = "0.6"   # also the Fn hold-key's event monitors (dictate.rs)
# the clean screen (src/clean.rs): ScreenCaptureKit frames shown on a layer, at the same objc2 0.3 set as above
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-io-surface"] }
objc2-core-foundation = "0.3"
objc2-quartz-core = "0.3"
dispatch2 = "0.3"
objc2-io-surface = { version = "0.3", features = ["objc2-core-foundation"] }   # so an IOSurface is a CF type (core-video needs it)


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
