# The page people are sent to, sol.js.org (#169): site/ published with GitHub Pages, only in the public beta repo (the
# guard below), on every push to its main. site/install is the export's copy of sol/install, so the one line serves
# the same file the app bundles. Actions pinned by commit. In sol-dev this file is carried but never runs.
name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    if: github.repository == 'marcocyl04-ux/sol-beta'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
